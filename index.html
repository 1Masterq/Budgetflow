<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BudgetFlow</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <div class="container">


        <!-- =========================
             HEADER
        ========================== -->

        <header>

            <h1>🛒 Budgetflow</h1>

            <p>
                Plan your market. Know your spend.
            </p>

        </header>



        <!-- =========================
             BUDGET SETUP
        ========================== -->

        <section class="budget-setup">

            <div>

                <label for="budget">
                    Set Your Budget
                </label>

                <input
                    type="number"
                    id="budget"
                    placeholder="e.g. 50000"
                    min="0"
                >

            </div>


            <button onclick="setBudget()">
                Set Budget
            </button>

        </section>



        <!-- =========================
             BUDGET SUMMARY
        ========================== -->

        <section class="summary">


            <div class="summary-card">

                <span>Budget</span>

                <strong id="budgetDisplay">
                    ₦0
                </strong>

            </div>


            <div class="summary-card">

                <span>Total Spent</span>

                <strong id="spentDisplay">
                    ₦0
                </strong>

            </div>


            <div class="summary-card">

                <span>Remaining</span>

                <strong id="remainingDisplay">
                    ₦0
                </strong>

            </div>


        </section>



        <!-- =========================
             BUDGET PROGRESS
        ========================== -->

        <section class="progress-section">

            <div class="progress-header">

                <span>Budget Used</span>

                <strong id="percentage">
                    0%
                </strong>

            </div>


            <div class="progress-container">

                <div
                    class="progress-bar"
                    id="progressBar"
                ></div>

            </div>


            <p id="budgetMessage">
                Set a budget to start tracking your spending.
            </p>

        </section>



        <!-- =========================
             ADD ITEM
        ========================== -->

        <section class="input-section">


            <div class="input-group">

                <label for="item">
                    Item
                </label>

                <input
                    type="text"
                    id="item"
                    placeholder="e.g. Rice"
                >

            </div>


            <div class="input-group">

                <label for="quantity">
                    Quantity
                </label>

                <input
                    type="number"
                    id="quantity"
                    placeholder="e.g. 2"
                    min="1"
                >

            </div>


            <div class="input-group">

                <label for="amount">
                    Unit Price (₦)
                </label>

                <input
                    type="number"
                    id="amount"
                    placeholder="e.g. 5000"
                    min="0"
                >

            </div>


            <button
                class="add-btn"
                onclick="addItem()"
            >
                + Add Item
            </button>


        </section>



        <!-- =========================
             MARKET TABLE
        ========================== -->

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>#</th>

                        <th>Item</th>

                        <th>Qty</th>

                        <th>Unit Price</th>

                        <th>Total</th>

                        <th>Action</th>

                    </tr>

                </thead>


                <tbody id="marketList">

                </tbody>

            </table>


            <div
                id="emptyMessage"
                class="empty-message"
            >

                <div>🛒</div>

                <h3>
                    Your market list is empty
                </h3>

                <p>
                    Add your first item above.
                </p>

            </div>

        </div>



        <!-- =========================
             GRAND TOTAL
        ========================== -->

        <div class="grand-total">

            <span>
                TOTAL MARKET COST
            </span>

            <strong id="grandTotal">
                ₦0
            </strong>

        </div>



        <!-- =========================
             CLEAR BUTTON
        ========================== -->

        <button
            class="clear-btn"
            onclick="clearEverything()"
        >
            🗑 Clear Everything
        </button>


    </div>



    <script src="script.js"></script>

</body>

</html>
